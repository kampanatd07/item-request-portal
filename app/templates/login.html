{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ · Item Request Portal{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 48px auto;">
  <h2 style="margin-top: 0;">เข้าสู่ระบบ</h2>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="email">อีเมล</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">รหัสผ่าน</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <p class="muted">ยังไม่มีบัญชี หรือลืมรหัสผ่าน ติดต่อฝ่ายจัดซื้อ</p>
</div>
{% endblock %}
