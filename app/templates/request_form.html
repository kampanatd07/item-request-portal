{% extends "base.html" %}
{% block title %}ส่งคำขอสร้าง Item{% endblock %}
{% block content %}
<div class="card">
  <h2>ส่งคำขอสร้าง Item</h2>
  <form hx-post="/requests" hx-target="#form-result" hx-swap="innerHTML">
    <div class="row">
      <div>
        <label>ชื่อผู้ขอ *</label>
        <input name="requester_name" required>
      </div>
      <div>
        <label>Email ผู้ขอ *</label>
        <input name="requester_email" type="email" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>โรงงาน *</label>
        <select name="factory_id" required
                hx-get="/fragments/systems" hx-target="#system-slot" hx-swap="innerHTML">
          <option value="" disabled selected>-- เลือกโรงงาน --</option>
          {% for f in factories %}
          <option value="{{ f.id }}">{{ f.code }} — {{ f.name }}</option>
          {% endfor %}
        </select>
        <script>
        document.querySelector('select[name=factory_id]').addEventListener('change', function(e){
          htmx.ajax('GET','/fragments/categories?factory_id='+e.target.value,{target:'#category-slot',swap:'innerHTML'});
        });
        </script>
      </div>
      <div>
        <label>ประเภท / ระบบรหัส *</label>
        <div id="system-slot">
          <select name="code_system_id" required disabled>
            <option>-- เลือกโรงงานก่อน --</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>หมวดสินค้า *</label>
        <div id="group-slot">
          <select name="group_id" required disabled>
            <option>-- เลือกระบบก่อน --</option>
          </select>
        </div>
      </div>
      <div>
        <label>หมวดย่อย</label>
        <div id="subgroup-slot">
          <select name="subgroup_id" disabled>
            <option value="">-- ไม่มี --</option>
          </select>
        </div>
      </div>
    </div>

    <label>ชื่อเรียกสินค้า * <span class="muted">(เฉพาะชื่อ ไม่ต้องใส่แบรนด์/รุ่น/ขนาด)</span></label>
    <input name="item_name" required placeholder="เช่น Ball Bearing"
           hx-post="/fragments/duplicates" hx-target="#dup-slot" hx-swap="innerHTML"
           hx-include="closest form" hx-trigger="keyup changed delay:600ms">
    <div id="dup-slot"></div>
    <!-- both filled by out-of-band swaps from /fragments/duplicates -->
    <div id="cat-slot"></div>
    <div id="sn-slot"></div>
    <div class="row">
      <div><label>แบรนด์</label><input name="brand" placeholder="เช่น SKF"
           hx-post="/fragments/duplicates" hx-target="#dup-slot" hx-swap="innerHTML"
           hx-include="closest form" hx-trigger="keyup changed delay:600ms"></div>
      <div><label>รุ่น</label><input name="model" placeholder="เช่น UCF209-28"
           hx-post="/fragments/duplicates" hx-target="#dup-slot" hx-swap="innerHTML"
           hx-include="closest form" hx-trigger="keyup changed delay:600ms"></div>
      <div>
        <label>ขนาด</label>
        <input name="size" placeholder='เช่น 4 นิ้ว, 10x20mm, กว้าง 10 สูง 20'
               hx-post="/fragments/size" hx-target="#size-hint" hx-swap="innerHTML"
               hx-trigger="keyup changed delay:500ms">
        <div id="size-hint"></div>
      </div>
      <div><label>ชนิด/สี</label><input name="variant" placeholder="เช่น EPDM ดำ"></div>
      <div>
        <label>หน่วยนับ</label>
        <select name="uom">
          <option value="" disabled selected>-- เลือกหน่วย --</option>
          {% for u in uoms %}<option value="{{ u.code }}">{{ u.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Search name (ชื่อหมวด — ระบบแนะนำให้)</label><input name="search_name" id="search_name" placeholder="เช่น BEARING"></div>
      <div><label>ราคาซื้อโดยประมาณ</label><input name="purchase_price" placeholder="เช่น 2320"></div>
    </div>
    <label>Procurement Category</label>
    <div id="category-slot">
      <select name="procurement_category">
        <option value="">-- เลือกโรงงานก่อน --</option>
      </select>
    </div>
    <label>สเปค / รายละเอียดเพิ่มเติม</label>
    <textarea name="spec_note" rows="3" placeholder="ชนิด สี หรือรายละเอียดอื่นๆ"></textarea>

    <div class="card" style="background:#f0f7f4; margin-top:16px;">
      <span class="muted">ชื่อสินค้าที่ระบบจะบันทึก (ประกอบอัตโนมัติ):</span>
      <div id="name-preview" style="font-size:17px; font-weight:500; min-height:24px;">—</div>
    </div>

    <button type="submit">ส่งคำขอ</button>
  </form>
  <div id="form-result"></div>
</div>
<script>
// Select a suggested category: set the group dropdown, load its sub-categories,
// then select the sub once the fragment has swapped in.
function pickCategory(groupId, subId, btn) {
  var groupSel = document.querySelector('[name="group_id"]');
  if (!groupSel) return;
  groupSel.value = groupId;
  htmx.ajax('GET', '/fragments/subgroups?group_id=' + groupId,
            { target: '#subgroup-slot', swap: 'innerHTML' })
    .then(function () {
      var subSel = document.querySelector('[name="subgroup_id"]');
      if (subSel) { subSel.disabled = false; subSel.value = subId; }
    });
  if (btn) {
    btn.parentElement.parentElement
       .querySelectorAll('button').forEach(function (b) {
         b.style.background = '#fff'; b.style.color = '#185FA5';
       });
    btn.style.background = '#185FA5'; btn.style.color = '#fff';
  }
}

(function () {
  var fields = ["item_name", "brand", "model", "size", "variant"];
  function compose() {
    var parts = [], seen = {};
    fields.forEach(function (f) {
      var el = document.querySelector('[name="' + f + '"]');
      var v = el ? el.value.replace(/[=|\t]/g, " ").trim().replace(/\s+/g, " ") : "";
      if (!v) return;
      var key = v.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      v.toLowerCase().split(" ").forEach(function (t) { seen[t] = true; });
      parts.push(v);
    });
    document.getElementById("name-preview").textContent = parts.join(" ") || "—";
  }
  fields.forEach(function (f) {
    var el = document.querySelector('[name="' + f + '"]');
    if (el) el.addEventListener("input", compose);
  });
})();
</script>
{% endblock %}
