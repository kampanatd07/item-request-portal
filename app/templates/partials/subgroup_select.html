<select name="subgroup_id" {% if not subgroups %}disabled{% endif %}>
  {% if subgroups %}
  <option value="" disabled{{ "" if selected else " selected" }}>-- เลือกหมวดย่อย --</option>
  {% for g in subgroups %}
  <option value="{{ g.id }}"{{ " selected" if g.id == selected }}>{{ g.code }} — {{ g.name }}</option>
  {% endfor %}
  {% else %}
  <option value="">-- ไม่มี --</option>
  {% endif %}
</select>
