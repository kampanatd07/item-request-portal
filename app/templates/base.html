<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Item Request Portal{% endblock %}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
  <style>
    :root { --accent: #0F6E56; --border: #ddd; --muted: #666; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f7f6f3; color: #222; }
    header { background: var(--accent); color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 500; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; cursor: pointer; margin-top: 16px; }
    button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    button.danger { background: #a32d2d; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12.5px; background: #eee; }
    .badge.submitted { background: #e6f1fb; color: #0c447c; }
    .badge.in_review { background: #faeeda; color: #633806; }
    .badge.needs_info { background: #fbeaf0; color: #72243e; }
    .badge.approved { background: #eaf3de; color: #27500a; }
    .badge.rejected { background: #fcebeb; color: #791f1f; }
    .badge.exported, .badge.created, .badge.notified { background: #e1f5ee; color: #085041; }
    .error { background: #fcebeb; color: #791f1f; padding: 10px 14px; border-radius: 6px; margin-top: 12px; }
    .success { background: #e1f5ee; color: #085041; padding: 14px; border-radius: 6px; margin-top: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 16px; } .row > div { flex: 1; }
  </style>
</head>
<body>
<header>
  <strong>Item Request Portal</strong>
  <a href="/">ส่งคำขอ</a>
  <a href="/queue">คิวจัดซื้อ</a>
  <a href="/admin/snapshots">Snapshot</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
